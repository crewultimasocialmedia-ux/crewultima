<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Opportunities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: normal;
        }
        input[type="radio"] {
            margin-right: 5px;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #000000;
            background-color: #f0f0f0;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SECTION E: ENGAGEMENT OPPORTUNITIES</h1>
        <form>
            <div class="form-group">
                <label>Do you have a documented marketing strategy? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="strategy" value="yes" required> Yes</label>
                    <label><input type="radio" name="strategy" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label>Do you have a sales funnel? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="funnel" value="yes" required> Yes</label>
                    <label><input type="radio" name="funnel" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="automationLevel">Automation Level (1–5) *</label>
                <input type="range" id="automationLevel" name="automationLevel" min="1" max="5" required>
                <small style="display: block; margin-top: 5px;">1 = No Automation, 5 = Fully Automated</small>
            </div>

            <div class="form-group">
                <label for="brandingGaps">Identify branding gaps *</label>
                <textarea id="brandingGaps" name="brandingGaps" required></textarea>
            </div>

            <div class="form-group">
                <label for="communicationGaps">Identify communication gaps *</label>
                <textarea id="communicationGaps" name="communicationGaps" required></textarea>
            </div>

            <div class="form-group">
                <label for="digitalGaps">Identify digital gaps *</label>
                <textarea id="digitalGaps" name="digitalGaps" required></textarea>
            </div>

            <div class="form-group">
                <label for="improvementAreas">Immediate improvement areas *</label>
                <input type="text" id="improvementAreas" name="improvementAreas" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="addOnServices">Interested in add-on services? *</label>
                <input type="text" id="addOnServices" name="addOnServices" placeholder="Comma separated values" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
