<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Points</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: normal;
        }
        input[type="radio"] {
            margin-right: 5px;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #000000;
            background-color: #f0f0f0;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SECTION C: CLIENT PAIN POINT DIAGNOSIS</h1>
        <form>
            <div class="form-group">
                <label for="branding">Branding consistency challenge (1–5) *</label>
                <input type="range" id="branding" name="branding" min="1" max="5" required>
                <small style="display: block; margin-top: 5px;">1 = No Issue, 5 = Major Issue</small>
            </div>

            <div class="form-group">
                <label for="audience">Difficulty reaching target audience (1–5) *</label>
                <input type="range" id="audience" name="audience" min="1" max="5" required>
                <small style="display: block; margin-top: 5px;">1 = No Issue, 5 = Major Issue</small>
            </div>

            <div class="form-group">
                <label for="leadQuality">Low lead quality challenge (1–5) *</label>
                <input type="range" id="leadQuality" name="leadQuality" min="1" max="5" required>
                <small style="display: block; margin-top: 5px;">1 = No Issue, 5 = Major Issue</small>
            </div>

            <div class="form-group">
                <label for="conversion">Poor conversion rates (1–5) *</label>
                <input type="range" id="conversion" name="conversion" min="1" max="5" required>
                <small style="display: block; margin-top: 5px;">1 = No Issue, 5 = Major Issue</small>
            </div>

            <div class="form-group">
                <label>Do you face content creation delays? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="contentDelay" value="yes" required> Yes</label>
                    <label><input type="radio" name="contentDelay" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label>Do you face approval bottlenecks? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="approvalBottleneck" value="yes" required> Yes</label>
                    <label><input type="radio" name="approvalBottleneck" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label>Do you lack skilled marketing resources? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="resources" value="yes" required> Yes</label>
                    <label><input type="radio" name="resources" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="workflow">Describe workflow issues *</label>
                <textarea id="workflow" name="workflow" required></textarea>
            </div>

            <div class="form-group">
                <label for="underperforming">Which digital channels are underperforming? *</label>
                <input type="text" id="underperforming" name="underperforming" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="analytics">Which analytics tools do you use? *</label>
                <input type="text" id="analytics" name="analytics" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="leadSources">Current lead generation sources *</label>
                <input type="text" id="leadSources" name="leadSources" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="monthlyLeads">Monthly inbound leads *</label>
                <input type="text" id="monthlyLeads" name="monthlyLeads" required>
            </div>

            <div class="form-group">
                <label for="conversionRate">Conversion rate (%) *</label>
                <input type="text" id="conversionRate" name="conversionRate" required>
            </div>

            <div class="form-group">
                <label for="retention">Customer retention challenges *</label>
                <textarea id="retention" name="retention" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
