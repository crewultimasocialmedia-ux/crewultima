<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"],
        input[type="url"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: normal;
        }
        input[type="radio"] {
            margin-right: 5px;
        }
        input[type="text"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #000000;
            background-color: #f0f0f0;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SECTION D: CURRENT MARKETING & CREATIVE ENGAGEMENT</h1>
        <form>
            <div class="form-group">
                <label>Are you currently working with an agency? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="agency" value="yes" required> Yes</label>
                    <label><input type="radio" name="agency" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="outsourced">What services are outsourced? *</label>
                <input type="text" id="outsourced" name="outsourced" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="expectations">Expectations from marketing partner *</label>
                <textarea id="expectations" name="expectations" required></textarea>
            </div>

            <div class="form-group">
                <label for="websiteUrl">Website URL *</label>
                <input type="url" id="websiteUrl" name="websiteUrl" required>
            </div>

            <div class="form-group">
                <label for="socialProfiles">Social media profile links *</label>
                <textarea id="socialProfiles" name="socialProfiles" placeholder="One per line" required></textarea>
            </div>

            <div class="form-group">
                <label for="adAccounts">Which ad accounts are connected? *</label>
                <input type="text" id="adAccounts" name="adAccounts" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="campaignFiles">Upload past campaign files</label>
                <input type="file" id="campaignFiles" name="campaignFiles" multiple>
            </div>

            <div class="form-group">
                <label for="creativeRequirements">Recurring creative requirements *</label>
                <input type="text" id="creativeRequirements" name="creativeRequirements" placeholder="Comma separated values" required>
            </div>

            <div class="form-group">
                <label for="monthlyCreative">Monthly creative volume *</label>
                <select id="monthlyCreative" name="monthlyCreative" required>
                    <option value="">-- Select --</option>
                    <option value="10-15">10–15</option>
                    <option value="15-20">15–20</option>
                    <option value="20-30">20–30</option>
                    <option value="30-50">30–50</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
