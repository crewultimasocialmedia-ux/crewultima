<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #000000;
            background-color: #f0f0f0;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SECTION G: INTERNAL NOTES & FOLLOW-UP</h1>
        <form>
            <div class="form-group">
                <label for="consultantNotes">Internal consultant notes *</label>
                <textarea id="consultantNotes" name="consultantNotes" required></textarea>
            </div>

            <div class="form-group">
                <label for="qualificationScore">Lead qualification score (out of 100) *</label>
                <input type="number" id="qualificationScore" name="qualificationScore" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label for="nextActions">Next actions *</label>
                <textarea id="nextActions" name="nextActions" placeholder="List proposed next steps (Proposal, Strategy Call, Demo, Onboarding, Budget Approval, etc.)" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
